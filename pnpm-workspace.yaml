allowBuilds:
  esbuild: true
  spawn-sync: true
minimumReleaseAgeExclude:
  - daisyui@5.7.9 || 5.7.40
# vite is NOT a security override any more (GHSA-v2wj/p9ff/fx2h is long patched).
# It stays as a major pin: wxt 0.21 peer-requires vite ^7.3.5, and without it
# pnpm resolves vite 8 (swapping rollup for rolldown) and breaks that peer.
# Drop it when wxt itself moves to vite 8.
#
# The rest are security overrides for vulnerable transitive dev/build deps
# (GitHub Dependabot alerts), each pinned to its patched floor within the
# CURRENT major (caret) so the wxt 0.21 / vite 7 tree keeps working.
# Drop an entry once a direct dep (wxt, @tailwindcss/vite, vitest) pulls the
# patched version on its own.
overrides:
  vite: '^7.3.5'
  nanoid: '^3.3.18'                 # GHSA-9p7f-9hcq-fv9j   (predictable IDs) — 3.x line
  browserslist: '^4.29.0'           # GHSA-73wf-gq98-2v4g   (ReDoS)
  baseline-browser-mapping: '^2.11.0'  # GHSA-w5vr-8v7q-w6rv (DoS on invalid input)
